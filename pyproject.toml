[project]
name = "cantera-pfr"
version = "0.2.0"
description = "Plug-flow reactor models and kinetic mechanism analysis with Cantera"
readme = "README.md"
authors = [
    { name = "Walter Dal'Maz Silva", email = "walter.dalmazsilva@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cantera>=2.4.0",
    "matplotlib>=2.2.0",
    "networkx>=2.1",
    "numpy>=1.11.0",
    "pandas>=0.23.4",
    "scipy>=1.0.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cantera_pfr = ["data/*"]
